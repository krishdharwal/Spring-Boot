# App server
server:
  port: 8090
  forward-headers-strategy: framework

# Spring Application
spring:
  application:
    name: api-gateway-ms

  cloud:
    gateway:
      routes:
        # company MS
        - id: company-service
          uri: lb://COMPANYMICROSERVICE
          predicates:
            - Path=/company/**

        # job MS
        - id: job-service
          uri: lb://JOBMICROSERVICE
          predicates:
            - Path=/job/**

        # Review MS
        - id: review-service   # Changed ID to avoid duplication
          uri: lb://REVIEWSMICROSERVICE
          predicates:
            - Path=/reviews/**

        # eureka server
        - id: eureka-server
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/main
          filters:
            - SetPath=/

        # For Eureka CSS and other static resources
        - id: eureka-server-static
          uri: http://localhost:8761
          predicates:
            - Path=/eureka/**

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

# Zipkin Tracing
management:
  tracing:
    sampling:
      probability: 1.0

# Logging Configuration
logging:
  level:
    root: info
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO
    org.springframework.cloud.gateway: TRACE

